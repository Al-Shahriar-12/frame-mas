:root{
  color-scheme: light;
  --bg:#E7ECEB; --panel:#F8FAF9; --panel-2:#EEF2F1; --input:#FFFFFF; --canvas:#F3F6F5;
  --ink:#1B2326; --ink-2:#465358; --ink-3:#76838A; --rule:#C5CED0; --rule-2:#DDE3E4; --grid:#A9B8BC;
  --accent:#0E5A75; --brand:#005BFB; --probe:#C27F00; --beam:#B9C3C7; --steel:#8F9BA1; --sel:#005BFB;
  --c-shear:#1C6A87; --c-moment:#AD3341; --c-slope:#38784A; --c-defl:#5949A8;
  --c-axial:#8F6000; --c-torsion:#8A477C; --c-react:#2A7A33; --c-load:#26323A; --c-lat:#2B66AE;
  --bg-3d:#E1E7E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#182023; --panel:#1F292D; --panel-2:#253136; --input:#1A2326; --canvas:#1A2225;
    --ink:#E3E9EB; --ink-2:#B0BCC1; --ink-3:#84939A; --rule:#34444B; --rule-2:#2A363B; --grid:#4A5C64;
    --accent:#62B5D4; --brand:#4C8DFF; --probe:#F0BE4A; --beam:#53636A; --steel:#7D8B92; --sel:#6FA3FF;
    --c-shear:#62B5D4; --c-moment:#EE7A86; --c-slope:#7CC48D; --c-defl:#A99CF2;
    --c-axial:#E2B44A; --c-torsion:#D68AC5; --c-react:#7FCB84; --c-load:#D3DCE0; --c-lat:#7EA9EE;
    --bg-3d:#1B2427;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#182023; --panel:#1F292D; --panel-2:#253136; --input:#1A2326; --canvas:#1A2225;
  --ink:#E3E9EB; --ink-2:#B0BCC1; --ink-3:#84939A; --rule:#34444B; --rule-2:#2A363B; --grid:#4A5C64;
  --accent:#62B5D4; --brand:#4C8DFF; --probe:#F0BE4A; --beam:#53636A; --steel:#7D8B92; --sel:#6FA3FF;
  --c-shear:#62B5D4; --c-moment:#EE7A86; --c-slope:#7CC48D; --c-defl:#A99CF2;
  --c-axial:#E2B44A; --c-torsion:#D68AC5; --c-react:#7FCB84; --c-load:#D3DCE0; --c-lat:#7EA9EE;
  --bg-3d:#1B2427;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:30px;height:30px;flex:none;color:var(--ink)}
.brand strong{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.2}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 10px 8px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--probe)}
@media (max-width:520px){.brand-text{display:none}.tab{padding:10px 6px 8px;font-size:15.5px}.top{gap:6px;padding:4px 8px}}

/* Layout */
.view{display:none}
body[data-view="frame"] #view-frame,body[data-view="3d"] #view-3d,body[data-view="summary"] #view-summary,body[data-view="about"] #view-about{display:block}
@media (max-width:999px){
  .model{display:none}
  body[data-view="model"] .model{display:block}
  body[data-view="model"] .work{display:none}
  .subtab[data-pane="selection"]{display:none}
}
@media (min-width:1000px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .top{position:relative;top:0;flex:none}
  .app{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr}
  .model{overflow:auto;min-height:0;border-right:1px solid var(--rule)}
  .work{overflow:auto;min-height:0}

}

/* Model panel */

<script>
"use strict";
function sectionProps(s) {
  const pos = v => (isFinite(+v) && +v > 0) ? +v : NaN;
  let A, Iz, Iy, J, cy, cz, depth, width, kVy, kVz, cT;
  switch (s.type) {
    case "I": {
      const d = pos(s.d), bf = pos(s.bf), tf = pos(s.tf), tw = pos(s.tw), hw = d - 2 * tf;
      A = 2 * bf * tf + hw * tw;
      Iz = (bf * d ** 3 - (bf - tw) * hw ** 3) / 12;
      Iy = (2 * tf * bf ** 3 + hw * tw ** 3) / 12;
      J = (2 * bf * tf ** 3 + hw * tw ** 3) / 3;
      cy = d / 2; cz = bf / 2; depth = d; width = bf;
      kVy = 1 / (d * tw); kVz = 1.5 / (2 * bf * tf); cT = Math.max(tf, tw);
      if (!(hw > 0) || !(tw <= bf)) A = NaN;
      break;
    }
    case "rect": {
      const b = pos(s.b), h = pos(s.h), lw = Math.max(b, h), t = Math.min(b, h);
      A = b * h; Iz = b * h ** 3 / 12; Iy = h * b ** 3 / 12;
      J = (1 / 3 - 0.21 * (t / lw) * (1 - t ** 4 / (12 * lw ** 4))) * lw * t ** 3;
      cy = h / 2; cz = b / 2; depth = h; width = b; kVy = kVz = 1.5 / A; cT = t;
      break;
    }
    case "circle": {
      const D = pos(s.D);
      A = Math.PI * D * D / 4; Iz = Iy = Math.PI * D ** 4 / 64; J = 2 * Iz;
      cy = cz = D / 2; depth = width = D; kVy = kVz = 4 / (3 * A); cT = D / 2;
      break;
    }
    case "pipe": {
      const D = pos(s.D), t = pos(s.t), Di = D - 2 * t;
      A = Math.PI * (D * D - Di * Di) / 4; Iz = Iy = Math.PI * (D ** 4 - Di ** 4) / 64; J = 2 * Iz;
      cy = cz = D / 2; depth = width = D; kVy = kVz = 2 / A; cT = D / 2;
      if (!(Di >= 0)) A = NaN;
      break;
    }
    default: {
      A = pos(s.A); Iz = pos(s.Iz) * 1e6; Iy = pos(s.Iy) * 1e6; J = pos(s.J) * 1e6;
      depth = pos(s.depth); width = pos(s.width); cy = depth / 2; cz = width / 2;
      kVy = kVz = 1 / A; cT = Math.min(depth, width);
    }
  }
  return {
    type: s.type, round: s.type === "circle" || s.type === "pipe",
    A, Iz, Iy, J, cy, cz, depth, width, kVy, kVz, cT, Sz: Iz / cy, Sy: Iy / cz,
    m: { A: A * 1e-6, Iz: Iz * 1e-12, Iy: Iy * 1e-12, J: J * 1e-12 }
  };
}


/* ================= Frame solver (2D) =================
   Plane frame in X–Y (Y up). Three degrees of freedom per node: u (X), v (Y),
   θ (anticlockwise). Euler–Bernoulli frame elements with axial stiffness,
   moment releases at either end by static condensation, exact fixed-end
   forces for partial trapezoidal and point loads, load cases solved with one
   factorisation, then combinations and envelopes by superposition.
   Units: kN, m, kN·m; E in GPa, sections in mm (converted in sectionProps). */
const EPS = 1e-9;
const SUPPORTS = {
  free:    { label: "Free", r: [0, 0, 0] },
  fixed:   { label: "Fixed", r: [1, 1, 1] },
  pin:     { label: "Pin", r: [1, 1, 0] },
  rollerX: { label: "Roller (slides along X)", r: [0, 1, 0] },
  rollerY: { label: "Roller (slides along Y)", r: [1, 0, 0] },
  guidedX: { label: "Guided (slides along X)", r: [0, 1, 1] },
  guidedY: { label: "Guided (slides along Y)", r: [1, 0, 1] }
};
const LOAD_DIRS = {
  gravity: { label: "Gravity (−Y)", g: [0, -1] },
  up:      { label: "Upward (+Y)", g: [0, 1] },
  px:      { label: "Global +X", g: [1, 0] },
  nx:      { label: "Global −X", g: [-1, 0] },
  lneg:    { label: "Normal, local −y", local: -1 },
  lpos:    { label: "Normal, local +y", local: 1 }
};
const GAUSS3 = [[-Math.sqrt(0.6), 5 / 9], [0, 8 / 9], [Math.sqrt(0.6), 5 / 9]];

/* LU factorisation with Jacobi scaling and partial pivoting. */
function luFactor(K, tolRel) {
  const n = K.length;
  const s = new Float64Array(n);
  for (let i = 0; i < n; i++) { const k = K[i][i]; if (!(k > 0)) return { fail: i }; s[i] = 1 / Math.sqrt(k); }
  const A = K.map((row, i) => Float64Array.from(row, (v, j) => v * s[i] * s[j]));
  const perm = Int32Array.from({ length: n }, (_, i) => i);
  for (let c = 0; c < n; c++) {
    let p = c, mx = Math.abs(A[c][c]);
    for (let r = c + 1; r < n; r++) { const v = Math.abs(A[r][c]); if (v > mx) { mx = v; p = r; } }
    if (!(mx > tolRel) || !isFinite(mx)) return { fail: c };
    if (p !== c) { const t = A[p]; A[p] = A[c]; A[c] = t; const tp = perm[p]; perm[p] = perm[c]; perm[c] = tp; }
    const Ac = A[c], piv = Ac[c];
    for (let r = c + 1; r < n; r++) {
      const Ar = A[r], f = Ar[c] / piv;
      if (f === 0) continue;
      Ar[c] = f;
      for (let k = c + 1; k < n; k++) Ar[k] -= f * Ac[k];
    }
  }
  return { A, perm, s, n };
}
function luSolve(F, b) {
  const { A, perm, s, n } = F;
  const y = new Float64Array(n);
  for (let i = 0; i < n; i++) { let v = b[perm[i]] * s[perm[i]]; for (let k = 0; k < i; k++) v -= A[i][k] * y[k]; y[i] = v; }
  const x = new Float64Array(n);
  for (let i = n - 1; i >= 0; i--) { let v = y[i]; for (let k = i + 1; k < n; k++) v -= A[i][k] * x[k]; x[i] = v / A[i][i]; }
  for (let i = 0; i < n; i++) x[i] *= s[i];
  return x;
}

function kLocal(EA, EI, L) {
  const a = EA / L, b = 12 * EI / L ** 3, c = 6 * EI / L ** 2, d = 4 * EI / L, e = 2 * EI / L;
  return [
    [a, 0, 0, -a, 0, 0],
    [0, b, c, 0, -b, c],
    [0, c, d, 0, -c, e],
    [-a, 0, 0, a, 0, 0],
    [0, -b, -c, 0, b, -c],
    [0, c, e, 0, -c, d]
  ];
}
/* Condense released rotations b (local dof 2 and/or 5). */
function condenser(k, b) {
  if (!b.length) return { kc: k.map(r => r.slice()), inv: null, b };
  let inv;
  if (b.length === 1) inv = [[1 / k[b[0]][b[0]]]];
  else {
    const p = k[b[0]][b[0]], q = k[b[0]][b[1]], r = k[b[1]][b[0]], t = k[b[1]][b[1]], det = p * t - q * r;
    inv = [[t / det, -q / det], [-r / det, p / det]];
  }
  const kc = [];
  for (let i = 0; i < 6; i++) {
    kc.push([]);
    for (let j = 0; j < 6; j++) {
      if (b.includes(i) || b.includes(j)) { kc[i].push(0); continue; }
      let v = k[i][j];
      for (let p = 0; p < b.length; p++) for (let q = 0; q < b.length; q++) v -= k[i][b[p]] * inv[p][q] * k[b[q]][j];
      kc[i].push(v);
    }
  }
  return { kc, inv, b };
}

/* Loads on a member in local axes for one case: distributed (linear on [x1,x2]) and point. */
function memberLoadsLocal(m, loads, selfWeightW) {
  const dist = [], pts = [];
  const comp = dir => {
    const D = LOAD_DIRS[dir] || LOAD_DIRS.gravity;
    if (D.local) return [0, D.local];
    const [gx, gy] = D.g;
    return [gx * m.c + gy * m.s, -gx * m.s + gy * m.c];
  };
  for (const ld of loads) {
    const [ax, ay] = comp(ld.dir);
    if (ld.type === "dist") {
      let x1 = ld.full ? 0 : +ld.x1, x2 = ld.full ? m.L : +ld.x2, w1 = +ld.w1, w2 = ld.type === "dist" && ld.uniform ? +ld.w1 : +ld.w2;
      if (!isFinite(x1) || !isFinite(x2) || !isFinite(w1) || !isFinite(w2)) continue;
      if (x2 < x1) { [x1, x2] = [x2, x1]; [w1, w2] = [w2, w1]; }
      x1 = Math.max(0, Math.min(m.L, x1)); x2 = Math.max(0, Math.min(m.L, x2));
      if (x2 - x1 < 1e-9) continue;
      dist.push({ x1, x2, qx1: ax * w1, qx2: ax * w2, qy1: ay * w1, qy2: ay * w2, src: ld });
    } else if (ld.type === "point") {
      const a = Math.max(0, Math.min(m.L, +ld.a)), P = +ld.P;
      if (!isFinite(a) || !isFinite(P)) continue;
      pts.push({ a, Px: ax * P, Py: ay * P, src: ld });
    }
  }
  if (selfWeightW > 0) {
    const [ax, ay] = comp("gravity");
    dist.push({ x1: 0, x2: m.L, qx1: ax * selfWeightW, qx2: ax * selfWeightW, qy1: ay * selfWeightW, qy2: ay * selfWeightW, sw: true });
  }
  return { dist, pts };
}
/* Consistent load vector Q (local) of a fixed-fixed member; fixed-end forces = −Q. */
function consistentLoads(L, ml) {
  const Q = new Float64Array(6);
  const shape = x => {
    const xi = x / L;
    return [1 - xi, 1 - 3 * xi * xi + 2 * xi ** 3, L * (xi - 2 * xi * xi + xi ** 3), xi, 3 * xi * xi - 2 * xi ** 3, L * (-xi * xi + xi ** 3)];
  };
  for (const d of ml.dist) {
    const h = (d.x2 - d.x1) / 2, mid = (d.x1 + d.x2) / 2;
    for (const [g, w] of GAUSS3) {
      const x = mid + g * h, t = (x - d.x1) / (d.x2 - d.x1);
      const qx = d.qx1 + (d.qx2 - d.qx1) * t, qy = d.qy1 + (d.qy2 - d.qy1) * t, N = shape(x);
      Q[0] += w * h * qx * N[0]; Q[3] += w * h * qx * N[3];
      Q[1] += w * h * qy * N[1]; Q[2] += w * h * qy * N[2]; Q[4] += w * h * qy * N[4]; Q[5] += w * h * qy * N[5];
    }
  }
  for (const p of ml.pts) {

    <div><p class="kicker">About the author</p><h2 id="author-name">MD Al Shahriar</h2>
      <p class="meta">BSc. in Civil Engineering, Bangladesh University of Engineering and Technology (BUET)</p><p class="meta">Creator of Flexure MAS and Frame MAS, MAS Studio</p>
      <p class="bio">MD Al Shahriar studied civil engineering at BUET. He builds free structural analysis tools so every engineering student can check beams and frames on any phone or computer.</p>
      <div class="links"><a class="btn-link primary" href="https://github.com/Al-Shahriar-12" target="_blank" rel="noopener">${GH} GitHub: Al-Shahriar-12</a><a class="btn-link" href="https://github.com/Al-Shahriar-12/frame-mas" target="_blank" rel="noopener">Source code</a><a class="btn-link" href="https://al-shahriar-12.github.io/flexure-mas/" target="_blank" rel="noopener">Flexure MAS</a></div></div></section>
  <section class="about-app"><h3>About Frame MAS</h3><p>Frame MAS analyses plane frames and trusses drawn on an ETABS-style grid. It handles rigid and hinged joints, truss members, any supports, load cases with design combinations and envelopes, and shows axial force, shear, moment, deflections and reactions on the frame and in 3D.</p>

/* ================= Appearance ================= */
const THEME_KEY = "mas:theme";   // shared by MAS Studio apps on the same site
const THEME_LABEL = { auto: "match device", light: "light", dark: "dark" };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>'
};
function applyTheme(t, save = true) {
  theme = THEME_LABEL[t] ? t : "auto";
  const root = document.documentElement;
  if (theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  const b = $("#btn-theme"); if (b) { b.innerHTML = THEME_ICON[theme]; b.title = `Appearance: ${THEME_LABEL[theme]}. Tap to change.`; b.setAttribute("aria-label", `Appearance: ${THEME_LABEL[theme]}`); }
  const sel = $("#in-theme"); if (sel) sel.value = theme;
  const dark = theme === "dark" || (theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute("content", dark ? "#1F292D" : "#F8FAF9"));
  if (save) { try { window.localStorage.setItem(THEME_KEY, theme); } catch (e) { /* storage unavailable */ } }
}

/* ================= Boot ================= */
(function boot() {
  const ins = document.createElement("div"); ins.className = "insp"; ins.id = "inspector"; $("#slot-desk").appendChild(ins);
  buildToolbar(); bindCanvas(); bindGridPane(); bindSectionsPane(); bindLoadsPane(); bindProjectPane(); bindInspector(); bindDiagrams(); bind3D();
  $$(".tab").forEach(t => t.addEventListener("click", () => setView(t.dataset.view)));
  $$(".subtab").forEach(t => t.addEventListener("click", () => setPane(t.dataset.pane)));
  $("#go-frame").addEventListener("click", () => setView("frame"));
  $("#sel-result").addEventListener("change", e => setResultKey(e.target.value));
  $("#summary").addEventListener("change", e => { if (e.target.id === "sum-result") setResultKey(e.target.value); });
  document.addEventListener("click", e => { const g = e.target.closest("[data-goto]"); if (g) { e.preventDefault(); setView(g.dataset.goto); } });
  document.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  document.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); openFile(e.dataTransfer.files[0]); } });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName), mod = e.ctrlKey || e.metaKey;
    if (mod && !typing && e.key.toLowerCase() === "z") { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && !typing && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
    else if (!typing && (e.key === "Delete" || e.key === "Backspace") && selection.size && view === "frame") { e.preventDefault(); deleteSelection(); }
    else if (e.key === "Escape" && !typing) { if (chainStart != null) chainStart = null; else selection.clear(); renderInspector(); renderDetail(); requestRender(); }
    else if (!typing && !mod && view === "frame") { const t = { v: "select", j: "node", m: "member", d: "delete" }[e.key.toLowerCase()]; if (t) setTool(t); }
  });
  const mq = window.matchMedia("(min-width: 1000px)");
  (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(() => { placeInspector(); requestRender(); });
  const retheme = () => { requestRender(); renderDetail(); T3.dirty = true; if (view === "3d") ensure3D(); };
  const dm = window.matchMedia("(prefers-color-scheme: dark)");
  (dm.addEventListener ? dm.addEventListener.bind(dm, "change") : dm.addListener.bind(dm))(retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  let savedTheme = "auto"; try { savedTheme = window.localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { savedTheme = "auto"; }
  applyTheme(savedTheme, false);
  $("#btn-theme").addEventListener("click", () => applyTheme({ auto: "light", light: "dark", dark: "auto" }[theme]));
  renderAbout();
  let restored = false;
  try { const saved = loadAutosave(); if (saved) { const r = readDoc(saved); model = r.model; if (r.units) U.sys = r.units; resultKey = r.resultKey || "case:" + model.cases[0].id; display = r.display; loadCase = model.cases[0].id; restored = true; } } catch (e) { restored = false; }
  if (!restored) { model = TEMPLATES[0].make(); applyCombos(defaultCombos(model.cases)); resultKey = model.combos[1] ? "combo:" + model.combos[1].id : "case:D"; loadCase = "D"; display = "M"; }
  syncDisplaySeg(); placeInspector(); setPane(isDesk() ? "selection" : "grid"); setView("frame");
  renderPanes(); runAnalysis(); updateUndoButtons();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { requestRender(); renderDetail(); });
  window.flexureBack = () => { if (view !== "frame") { setView("frame"); return true; } return false; };
  window.flexureFlush = () => { clearTimeout(autosaveTimer); autosaveNow(); };
  if (document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
})();

</script>
